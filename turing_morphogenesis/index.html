<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Turing Morphogenesis - Interactive Reaction-Diffusion Simulator</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #05070f;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #f8fafc;
    }
    #canvas-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }
    .hud-overlay {
      position: absolute;
      top: 24px;
      left: 24px;
      z-index: 10;
      background: rgba(12, 18, 30, 0.85);
      border: 1px solid rgba(0, 245, 212, 0.3);
      border-radius: 16px;
      padding: 20px 24px;
      backdrop-filter: blur(12px);
      max-width: 380px;
      box-shadow: 0 16px 32px rgba(0, 0, 0, 0.4);
    }
    h1 {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: #fff;
    }
    .tagline {
      font-size: 13px;
      color: #00f5d4;
      font-weight: 600;
      margin-top: 4px;
      margin-bottom: 12px;
    }
    .equation {
      background: rgba(0, 0, 0, 0.4);
      padding: 8px 12px;
      border-radius: 8px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 12px;
      color: #94a3b8;
      border-left: 3px solid #00f5d4;
      margin-bottom: 16px;
      line-height: 1.5;
    }
    .btn-group {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 14px;
    }
    .btn {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #fff;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .btn:hover {
      background: rgba(0, 245, 212, 0.15);
      border-color: #00f5d4;
      color: #00f5d4;
    }
    .tip {
      font-size: 11px;
      color: #64748b;
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <div id="canvas-container"></div>
  <div class="hud-overlay">
    <h1>Turing Morphogenesis</h1>
    <div class="tagline">Reaction-Diffusion (Gray-Scott Model)</div>
    <div class="equation">
      ∂u/∂t = D_u ∇²u - uv² + F(1-u)<br>
      ∂v/∂t = D_v ∇²v + uv² - (F+k)v
    </div>
    <div class="btn-group">
      <button class="btn" onclick="setMorphPreset('spots')">🐆 Leopard Spots</button>
      <button class="btn" onclick="setMorphPreset('stripes')">🦓 Zebra Stripes</button>
      <button class="btn" onclick="setMorphPreset('coral')">🧠 Brain Coral</button>
      <button class="btn" onclick="setMorphPreset('mitosis')">🧬 Dividing Cells</button>
    </div>
    <button class="btn" style="width: 100%; border-color: #f72585; color: #f72585;" onclick="initSimulation()">Reset Grid</button>
    <div class="tip">💡 Tip: Click and drag on the canvas to seed fresh activator chemicals!</div>
  </div>

  <script src="sketch.js"></script>
</body>
</html>
