<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Von Kármán Vortex Streets - Procanimation Studio</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #020617;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 24px;
    }
    header {
      text-align: center;
      margin-bottom: 20px;
    }
    h1 {
      font-size: 26px;
      color: #38bdf8;
      letter-spacing: 1px;
    }
    p.subtitle {
      color: #94a3b8;
      font-size: 14px;
      margin-top: 6px;
    }
    #canvas-container {
      position: relative;
      border: 1px solid rgba(56, 189, 248, 0.3);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
    }
    .controls {
      display: flex;
      gap: 16px;
      margin-top: 18px;
      background: #0f172a;
      padding: 14px 20px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      flex-wrap: wrap;
      align-items: center;
    }
    button {
      background: #00f5d4;
      color: #020617;
      font-weight: bold;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
    }
    button:hover { background: #38bdf8; }
    label { font-size: 13px; color: #94a3b8; display: flex; align-items: center; gap: 8px; }
  </style>
</head>
<body>
  <header>
    <h1>Von Kármán Vortex Streets</h1>
    <p class="subtitle">Navier-Stokes Wake Dynamics, Strouhal Frequency & Aeroelastic Flutter</p>
  </header>

  <div id="canvas-container">
    <canvas id="simCanvas" width="900" height="600"></canvas>
  </div>

  <div class="controls">
    <button id="btnStrake">Toggle Helical Strakes</button>
    <label>
      Reynolds ($Re$):
      <input type="range" id="sliderRe" min="20" max="300" step="5" value="160">
      <span id="valRe" style="color:#00f5d4; font-weight:bold;">160</span>
    </label>
    <label>
      Cylinder Radius ($R$):
      <input type="range" id="sliderR" min="18" max="45" step="1" value="28">
      <span id="valR" style="color:#f72585; font-weight:bold;">28</span>
    </label>
  </div>

  <script src="sketch.js"></script>
</body>
</html>
