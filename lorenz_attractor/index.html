<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Lorenz Strange Attractor — 3D Chaos Simulation</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #04060c;
      color: #f8fafc;
      font-family: system-ui, -apple-system, sans-serif;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
    }
    #canvas-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }
    .hud-overlay {
      position: absolute;
      top: 24px;
      left: 24px;
      z-index: 10;
      background: rgba(10, 15, 29, 0.82);
      border: 1px solid rgba(0, 245, 212, 0.25);
      border-radius: 12px;
      padding: 18px 24px;
      backdrop-filter: blur(12px);
      max-width: 440px;
    }
    h1 {
      font-size: 1.25rem;
      color: #00f5d4;
      margin-bottom: 6px;
      letter-spacing: -0.02em;
    }
    p {
      font-size: 0.85rem;
      color: #94a3b8;
      line-height: 1.45;
      margin-bottom: 12px;
    }
    .legend {
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: 0.8rem;
      font-family: monospace;
    }
    .traj-a { color: #00f5d4; }
    .traj-b { color: #f72585; }
    .links {
      margin-top: 14px;
      display: flex;
      gap: 12px;
      font-size: 0.8rem;
    }
    .links a {
      color: #38bdf8;
      text-decoration: none;
      font-weight: 600;
    }
    .links a:hover {
      text-decoration: underline;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
  <div id="canvas-container"></div>

  <div class="hud-overlay">
    <h1>The Lorenz Strange Attractor (1963)</h1>
    <p>3D deterministic chaos simulation demonstrating sensitive dependence on initial conditions (The Butterfly Effect).</p>
    <div class="legend">
      <span class="traj-a">● Trajectory A: x₀ = 0.1000 (Cyan)</span>
      <span class="traj-b">● Trajectory B: x₀ = 0.1001 (Magenta, Δ = 10⁻⁴)</span>
    </div>
    <div class="links">
      <a href="https://procanimation.github.io/experiments/lorenz-attractor.html" target="_blank">Interactive Research Lab ↗</a>
      <a href="https://www.youtube.com/shorts/T9CM8CtTHuY" target="_blank">Watch YouTube Short ↗</a>
    </div>
  </div>

  <script src="sketch.js"></script>
</body>
</html>
