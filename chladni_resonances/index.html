<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chladni Resonance Cymatics Simulator - Procanimation</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #030712;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 24px;
    }
    header { text-align: center; margin-bottom: 20px; }
    h1 {
      font-size: 28px;
      background: linear-gradient(135deg, #fff, #f59e0b);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 6px;
    }
    p { color: #94a3b8; font-size: 14px; }
    #canvas-container {
      background: #000;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 20px 40px rgba(0,0,0,0.8);
    }
    canvas { display: block; }
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 18px;
      background: #0f172a;
      padding: 12px 20px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      align-items: center;
    }
    button {
      background: #1e293b;
      color: #f59e0b;
      border: 1px solid rgba(245, 158, 11, 0.4);
      padding: 8px 16px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s;
    }
    button:hover { background: #f59e0b; color: #030712; }
    label { color: #94a3b8; font-size: 12px; }
  </style>
</head>
<body>
  <header>
    <h1>Chladni Figures & Acoustic Resonances</h1>
    <p>2D Helmholtz Standing Waves · Nodal Sand Migration · Cymatic Mandalas</p>
  </header>

  <div id="canvas-container">
    <canvas id="chladniCanvas" width="600" height="600"></canvas>
  </div>

  <div class="controls">
    <button id="btnShake">Scatter Sand</button>
    <label>Mode m:</label>
    <input type="range" id="mSlider" min="1" max="8" value="3" style="width:70px;">
    <label>Mode n:</label>
    <input type="range" id="nSlider" min="1" max="8" value="5" style="width:70px;">
  </div>

  <script src="sketch.js"></script>
</body>
</html>
