<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Buddhabrot & Nebulabrot - Procanimation Science</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #030611;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 24px;
    }
    header {
      text-align: center;
      margin-bottom: 20px;
      max-width: 720px;
    }
    h1 {
      font-size: 2.2rem;
      background: linear-gradient(135deg, #00f0ff, #f59e0b, #a855f7);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
    }
    p.lead {
      color: #94a3b8;
      font-size: 0.95rem;
      line-height: 1.5;
    }
    #canvasContainer {
      position: relative;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 0 50px rgba(0, 240, 255, 0.25);
      border: 1px solid rgba(56, 189, 248, 0.3);
    }
    canvas {
      display: block;
      background: #020308;
    }
    .hud {
      position: absolute;
      top: 10px;
      left: 10px;
      right: 10px;
      display: flex;
      justify-content: space-between;
      font-family: monospace;
      font-size: 11px;
      background: rgba(3, 7, 18, 0.85);
      padding: 6px 12px;
      border-radius: 6px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      pointer-events: none;
    }
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 16px;
      background: rgba(15, 23, 42, 0.8);
      padding: 12px 20px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      align-items: center;
    }
    button, select {
      background: #0284c7;
      color: #ffffff;
      border: none;
      padding: 8px 14px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      font-size: 12px;
    }
    button.secondary {
      background: rgba(255, 255, 255, 0.1);
      color: #cbd5e1;
    }
  </style>
</head>
<body>
  <header>
    <h1>The Buddhabrot & Nebulabrot</h1>
    <p class="lead">Melinda Green's 1993 dual complex plane orbit density mapping of $z_{n+1} = z_n^2 + c$. Only escaping trajectories accumulate into the 2D histogram.</p>
  </header>

  <div id="canvasContainer">
    <canvas id="buddhaCanvas" width="540" height="720"></canvas>
    <div class="hud">
      <div>Samples: <span id="hudSamples" style="color:#f59e0b; font-weight:bold;">0</span></div>
      <div>Escaped Orbits: <span id="hudEscaped" style="color:#00f0ff; font-weight:bold;">0</span></div>
      <div>Mode: <span id="hudMode" style="color:#a855f7; font-weight:bold;">Nebulabrot RGB</span></div>
    </div>
  </div>

  <div class="controls">
    <button id="btnPause">⏸ Pause</button>
    <button id="btnClear" class="secondary">🔄 Clear</button>
    <select id="selPalette">
      <option value="nebulabrot">Spectral Nebulabrot</option>
      <option value="amber">Amber Hologram</option>
      <option value="cyan">Cosmic Cyan</option>
    </select>
  </div>

  <script src="sketch.js"></script>
</body>
</html>
