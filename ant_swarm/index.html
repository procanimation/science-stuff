<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ant Swarm Intelligence & Stigmergy — Procanimation Studio</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #060912; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    #canvas-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
    .overlay {
      position: absolute;
      top: 24px;
      left: 24px;
      color: #f1f5f9;
      background: rgba(14, 20, 32, 0.85);
      backdrop-filter: blur(12px);
      padding: 16px 20px;
      border-radius: 10px;
      border: 1px solid rgba(77, 226, 208, 0.3);
      max-width: 360px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      pointer-events: auto;
    }
    h1 { font-size: 16px; color: #4de2d0; margin-bottom: 6px; letter-spacing: 0.5px; }
    p { font-size: 12px; color: #94a3b8; line-height: 1.5; margin-bottom: 12px; }
    .hint { font-size: 11px; color: #ffd166; font-weight: 500; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
</head>
<body>
  <div id="canvas-container"></div>
  <div class="overlay">
    <h1>ANT SWARM INTELLIGENCE</h1>
    <p>Watch 450 decentralized agents discover the shortest path through a maze without any leader or global map using evaporating pheromone stigmergy.</p>
    <div class="hint">💡 Drag the golden food source to test swarm re-routing!</div>
  </div>
  <script src="sketch.js"></script>
</body>
</html>
