<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Conway's Game of Life - Open Source Procedural Simulation</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #030712;
      color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 24px 16px;
    }
    h1 {
      font-size: 1.6rem;
      margin-bottom: 8px;
      color: #00f5d4;
      text-align: center;
    }
    p {
      color: #94a3b8;
      font-size: 0.9rem;
      margin-bottom: 16px;
      text-align: center;
      max-width: 720px;
    }
    #canvas-container {
      position: relative;
      width: 100%;
      max-width: 800px;
      height: 540px;
      background: #030816;
      border: 1px solid rgba(0, 245, 212, 0.3);
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 12px 32px rgba(0, 245, 212, 0.1);
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
      cursor: crosshair;
    }
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 16px;
      align-items: center;
      justify-content: center;
      max-width: 800px;
      width: 100%;
    }
    button, select {
      background: #111827;
      color: #f1f5f9;
      border: 1px solid #374151;
      padding: 8px 14px;
      border-radius: 6px;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    button:hover, select:hover {
      border-color: #00f5d4;
      color: #00f5d4;
    }
    .footer {
      margin-top: 24px;
      font-size: 0.8rem;
      color: #64748b;
      text-align: center;
    }
    .footer a {
      color: #00f5d4;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <h1>🧬 Conway's Game of Life</h1>
  <p>Zero-player cellular automaton governed by the Moore 8-neighbor matrix and Rule B3/S23. Click & drag on the grid to paint living cells.</p>

  <div id="canvas-container">
    <canvas id="lifeCanvas"></canvas>
  </div>

  <div class="controls">
    <button id="btnPlayPause">Pause</button>
    <button id="btnStep">Step +1</button>
    <button id="btnClear">Clear Grid</button>
    <button id="btnRandom">Random Soup</button>
    <select id="selectPreset">
      <option value="gosper">Gosper Glider Gun (MIT 1970)</option>
      <option value="pulsar">Pulsar (Period 3)</option>
      <option value="pentadecathlon">Pentadecathlon (Period 15)</option>
      <option value="gliders">Glider Fleet</option>
      <option value="acorn">Acorn (Methuselah)</option>
    </select>
  </div>

  <div class="footer">
    Developed by <a href="https://procanimation.github.io" target="_blank">Procanimation Studio</a> • Open Source Procedural Animation Series
  </div>

  <script src="sketch.js"></script>
</body>
</html>
